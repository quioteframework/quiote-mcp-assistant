# Factories in YAML -- see docs/CONFIG_SYSTEM_REWRITE_PLAN.md. Settings are in
# php, this is YAML, databases/output_types are XML: one
# generated app, all three FormatDrivers.
controller:
  class: Quiote\Controller\Controller
  params: []
response:
  class: Quiote\Response\WebResponse
  params: []
database_manager:
  class: Quiote\Database\DatabaseManager
  params: []
routing:
  class: QuioteMcpAssistant\Routing\AppRouting
  params: []
request:
  class: Quiote\Request\WebRequest
  params: []
# No `session` slot: this is a stateless MCP server (stdio and HTTP alike),
# so a context with no session entry gets a NullSessionBag -- reads return
# their default, writes are discarded. That is exactly what the pre-3.0
# `storage: Quiote\Storage\NullStorage` slot expressed, and 3.0 removed that
# class. See quiote-docs://basics/sessions ("The slot is optional").
user:
  class: Quiote\User\User
  params: []
validation_manager:
  class: Quiote\Validator\ValidationManager
  params: []
